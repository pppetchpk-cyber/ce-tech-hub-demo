const KEY='ce_tech_hub_mvp_v1';let state;function resetState(){state={guides:structuredClone(SEED_GUIDES),cases:structuredClone(SEED_CASES),feedback:[],audit:[]};save()}function load(){try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.guides)||!Array.isArray(state.cases))resetState()}function save(){localStorage.setItem(KEY,JSON.stringify(state))}load();
const adapter={async searchGuides({q='',category='All',admin=false}={}){let term=q.trim().toLowerCase();return state.guides.filter(g=>(admin||g.status==='Published')&&(category==='All'||g.product===category)&&(!term||[g.id,g.title,g.product,g.model,g.symptom,g.keywords,g.summary].join(' ').toLowerCase().includes(term)))},async createCase(payload){const id='CS-'+(1000+Math.max(0,...state.cases.map(c=>Number(c.id.split('-')[1])-1000))+1);const item={...payload,id,status:'Open',created:new Date().toISOString().slice(0,10),rootCause:'',resolution:''};state.cases.unshift(item);audit('Create Case',id);save();return item},async updateCase(payload){const item=state.cases.find(c=>c.id===payload.id);if(!item)throw Error('Case not found');Object.assign(item,payload);audit('Update Case',item.id);save();return item},async saveGuide(payload){const existing=state.guides.find(g=>g.id===payload.id);if(existing){Object.assign(existing,payload,{updated:new Date().toISOString().slice(0,10)});audit('Update Guide',existing.id)}else{const id='KB-'+String(Math.max(0,...state.guides.map(g=>Number(g.id.split('-')[1])))+1).padStart(3,'0');state.guides.unshift({...payload,id,status:'Draft',version:'1.0',updated:new Date().toISOString().slice(0,10)});audit('Create Guide',id)}save()},async approveGuide(id){const g=state.guides.find(x=>x.id===id);if(!g)throw Error('Guide not found');g.status='Published';g.updated=new Date().toISOString().slice(0,10);audit('Publish Guide',id);save()},async feedback(id,helpful){state.feedback.push({id,helpful,at:new Date().toISOString()});audit('Guide Feedback',id);save()}};
function audit(action,id){state.audit.unshift({action,id,at:new Date().toLocaleString()});state.audit=state.audit.slice(0,100)}function displayThai(s){const dict={'Washer':'เครื่องซักผ้า','Air Conditioner':'เครื่องปรับอากาศ','Refrigerator':'ตู้เย็น','Dryer':'เครื่องอบผ้า','TV':'โทรทัศน์','Other':'อื่น ๆ','All':'ทั้งหมด','Normal':'ปกติ','High':'สูง','Open':'เปิดเคส','In Review':'กำลังตรวจสอบ','Resolved':'แก้ไขแล้ว','Closed':'ปิดเคส','Published':'เผยแพร่แล้ว','Draft':'ฉบับร่าง','Bangkok Pilot':'ศูนย์นำร่องกรุงเทพฯ','Eastern Pilot':'ศูนย์นำร่องภาคตะวันออก','Northern Pilot':'ศูนย์นำร่องภาคเหนือ'};return dict[String(s)]??s}function esc(s){return String(displayThai(s??'')).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){document.getElementById('toastRoot').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>document.getElementById('toastRoot').innerHTML='',2600)}function modal(html){document.getElementById('overlay').innerHTML='<div class="modalback" id="backdrop"><div class="modal"><div class="row" style="margin-bottom:16px"><strong>CE TECH HUB</strong><button class="close" onclick="closeModal()">✕ ปิด</button></div>'+html+'</div></div>';document.getElementById('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()})}function closeModal(){document.getElementById('overlay').innerHTML=''}let view='technician',category='All',searchTerm='',adminTab='cases',adminFilter='All';
function setView(v){view=v;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('pageTitle').textContent=({technician:'พอร์ทัลสำหรับช่าง',admin:'ระบบหลังบ้านทีมเทคนิค',architecture:'โครงสร้างระบบและการนำไปใช้งาน'})[v];render()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.getElementById('resetBtn').onclick=()=>{if(confirm('ต้องการล้างเคส คู่มือ และผลตอบรับที่บันทึกไว้ในเบราว์เซอร์นี้ทั้งหมดหรือไม่?')){resetState();render();toast('ล้างข้อมูลสาธิตแล้ว')}};
function guideCard(g){return `<article class="card guide" data-guide="${esc(g.id)}"><div class="row"><span class="tag">${esc(g.product)}</span><span class="small muted">${esc(g.id)} · v${esc(g.version)}</span></div><h3>${esc(g.title)}</h3><div class="muted small">${esc(g.model)} · ${esc(g.symptom)}</div><p class="small">${esc(g.summary)}</p><div class="row"><span class="tag green">คู่มือผ่านการอนุมัติ</span><span class="link">เปิดคู่มือ →</span></div></article>`}
async function renderTechnician(){const guides=await adapter.searchGuides({q:searchTerm,category});document.getElementById('app').innerHTML=`<div class="hero"><div><div class="eyebrow" style="color:#b9d0ff">ความรู้สำหรับช่างภาคสนาม</div><h2>เจอปัญหา?<br>ค้นหาวิธีซ่อมได้ทันที</h2><p>ค้นหาวิธีซ่อมที่ผ่านการตรวจสอบด้วยรุ่นสินค้า รหัสข้อผิดพลาด หรือส่งเคสให้ทีมเทคนิคได้จากมือถือ</p></div><div class="heroIcon">⌕</div></div><div class="card"><div class="section" style="margin:0 0 13px"><h2>ค้นหาอาการเสียหรือรหัสข้อผิดพลาด</h2><span class="pill">เฉพาะคู่มือที่ผ่านการอนุมัติ</span></div><input id="searchInput" class="input search" placeholder="ค้นหารุ่นสินค้า รหัสข้อผิดพลาด หรืออาการเสีย…" value="${esc(searchTerm)}" aria-label="ค้นหาคู่มือซ่อม"><div class="row" style="margin-top:14px;flex-wrap:wrap"><div class="tabs">${['All','Washer','Air Conditioner','Refrigerator','Dryer'].map(c=>`<button class="tab ${category===c?'active':''}" data-category="${esc(c)}">${esc(c)}</button>`).join('')}</div><button class="btn" id="askBtn">✚ ส่งคำถามให้ทีมเทคนิค</button></div></div><div class="official-banner"><div><strong>ค้นหาคู่มือจาก Samsung โดยตรง</strong><div class="small muted">คู่มือผู้ใช้ คู่มือการติดตั้ง และเอกสารที่เผยแพร่สาธารณะ · ค้นหาด้วยรหัสรุ่นเต็ม</div></div><a class="official-btn" href="https://www.samsung.com/th/support/user-manuals-and-guide/" target="_blank" rel="noopener noreferrer">ค้นหาคู่มือทางการ ↗</a></div><div class="section"><h2>คู่มือที่พร้อมใช้งาน</h2><span class="muted small">${guides.length} คู่มือที่ตรงกับการค้นหา</span></div><div class="grid">${guides.length?guides.map(guideCard).join(''):'<div class="card empty">ไม่พบคู่มือที่อนุมัติแล้ว ลองค้นหาคำอื่นหรือส่งเคสให้ทีมเทคนิค</div>'}</div><div class="section"><h2>เคสที่ส่งให้ทีมเทคนิค</h2><span class="small muted">ข้อมูลจำลองสำหรับช่าง</span></div><div class="card tablewrap"><table><thead><tr><th>เลขที่เคส</th><th>รุ่นสินค้า</th><th>อาการเสีย</th><th>สถานะ</th><th>วันที่ส่ง</th></tr></thead><tbody>${state.cases.map(c=>`<tr><td><button class="link" data-case="${esc(c.id)}">${esc(c.id)}</button></td><td>${esc(c.model)}</td><td>${esc(c.symptom)}</td><td><span class="tag ${c.status==='Resolved'?'green':c.status==='In Review'?'amber':''}">${esc(c.status)}</span></td><td>${esc(c.created)}</td></tr>`).join('')}</tbody></table></div>`;document.getElementById('searchInput').oninput=e=>{searchTerm=e.target.value;clearTimeout(window._st);window._st=setTimeout(()=>{const pos=document.activeElement?.id==='searchInput';renderTechnician().then(()=>{if(pos){const el=document.getElementById('searchInput');el.focus();el.setSelectionRange(el.value.length,el.value.length)}})},180)};document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;renderTechnician()});document.getElementById('askBtn').onclick=openCaseForm;document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>openGuide(b.dataset.guide));document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(b.dataset.case,false))}
function openGuide(id){const g=state.guides.find(x=>x.id===id);if(!g)return;modal(`<span class="tag">${esc(g.product)}</span><h2>${esc(g.title)}</h2><p class="muted">${esc(g.id)} · รุ่นสินค้า: ${esc(g.model)} · เวอร์ชัน ${esc(g.version)} · ปรับปรุงล่าสุด ${esc(g.updated)}</p><div class="notice"><strong>ข้อควรระวัง:</strong> ขั้นตอนในต้นแบบเป็นเพียงตัวอย่าง งานซ่อมจริงต้องใช้คู่มือซ่อมตรงรุ่นและขั้นตอนที่ได้รับอนุมัติ</div><div class="official-links"><strong>คู่มือจากเว็บไซต์ Samsung ประเทศไทย</strong><p class="small muted">เปิดหน้าค้นหาคู่มือทางการ แล้วกรอกรหัสรุ่นเต็มเพื่อเลือกเอกสารที่ตรงกับเครื่อง</p><a class="official-btn" href="https://www.samsung.com/th/support/user-manuals-and-guide/" target="_blank" rel="noopener noreferrer">เปิดศูนย์ค้นหาคู่มือ Samsung ↗</a><a class="official-btn outline-link" href="https://www.samsung.com/th/support/" target="_blank" rel="noopener noreferrer">เปิดหน้าช่วยเหลือและแก้ปัญหา ↗</a></div><h3>อาการเสีย</h3><p>${esc(g.symptom)}</p><h3>แนวทางตรวจสอบเบื้องต้น</h3><ol>${g.steps.map(s=>`<li style="margin:9px 0">${esc(s)}</li>`).join('')}</ol><div class="row" style="flex-wrap:wrap;margin-top:20px"><div class="controls"><button class="btn secondary" id="helpfulYes">👍 มีประโยชน์</button><button class="btn secondary" id="helpfulNo">ไม่เป็นประโยชน์</button></div><button class="btn" id="escalateGuide">ส่งต่อทีมเทคนิค →</button></div>`);document.getElementById('helpfulYes').onclick=async()=>{await adapter.feedback(id,true);toast('บันทึกความคิดเห็นในเครื่องแล้ว')};document.getElementById('helpfulNo').onclick=async()=>{await adapter.feedback(id,false);toast('บันทึกความคิดเห็นในเครื่องแล้ว')};document.getElementById('escalateGuide').onclick=()=>{closeModal();openCaseForm(g)}}
function openCaseForm(g){modal(`<h2>ส่งเคสให้ทีมเทคนิค</h2><p class="muted">Send an unresolved issue to the Tech Support queue. This demo stores cases only in your browser.</p><form id="caseForm" class="formgrid"><div class="field"><label>ประเภทสินค้า</label><select class="input" name="product" required>${['Washer','Air Conditioner','Refrigerator','Dryer','TV','Other'].map(c=>`<option ${g?.product===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>รหัสรุ่นสินค้า *</label><input class="input" name="model" required maxlength="80" value="${esc(g?.model||'')}" placeholder="ระบุรหัสรุ่นสินค้า"></div><div class="field"><label>ศูนย์บริการ *</label><input class="input" name="center" required maxlength="100" placeholder="เช่น ศูนย์บริการกรุงเทพฯ"></div><div class="field"><label>ความเร่งด่วน</label><select class="input" name="priority"><option>Normal</option><option>High</option></select></div><div class="field full"><label>อาการเสียและสิ่งที่ตรวจสอบแล้ว *</label><textarea class="input" name="symptom" required maxlength="2000" placeholder="อธิบายอาการ รหัส Error และสิ่งที่ตรวจสอบแล้ว">${esc(g?.title||'')}</textarea></div><div class="field full"><label>ชื่อช่าง / รหัสช่างทดลอง</label><input class="input" name="technician" maxlength="80" placeholder="ช่างทดสอบ" value="ช่างทดสอบ"></div><div class="field full"><button class="btn" type="submit">ส่งเคสเข้าระบบ</button></div></form>`);document.getElementById('caseForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),payload=Object.fromEntries(f.entries());const c=await adapter.createCase(payload);closeModal();render();toast('Demo case '+c.id+' created')}}
function openCase(id,edit){const c=state.cases.find(x=>x.id===id);if(!c)return;modal(`<h2>${esc(c.id)} · ${esc(c.model)}</h2><p class="muted">${esc(c.product)} · ${esc(c.center)} · วันที่ส่ง ${esc(c.created)}</p><div class="notice">${esc(c.symptom)}</div>${edit?`<form id="updateCaseForm" class="stack" style="margin-top:18px"><div class="field"><label>สถานะ</label><select class="input" name="status">${['Open','In Review','Resolved','Closed'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>สาเหตุที่ตรวจสอบยืนยันแล้ว</label><textarea class="input" name="rootCause" placeholder="บันทึกผลวิเคราะห์และหลักฐาน">${esc(c.rootCause)}</textarea></div><div class="field"><label>วิธีแก้ไข / ผลการซ่อม</label><textarea class="input" name="resolution" placeholder="บันทึกวิธีแก้ไขที่ยืนยันแล้ว">${esc(c.resolution)}</textarea></div><button class="btn">บันทึกการอัปเดตเคส</button></form>`:`<p><strong>สถานะ:</strong> ${esc(c.status)}</p><p><strong>Root cause:</strong> ${esc(c.rootCause||'Pending investigation')}</p><p><strong>Resolution:</strong> ${esc(c.resolution||'Pending technical response')}</p>`}`);if(edit)document.getElementById('updateCaseForm').onsubmit=async e=>{e.preventDefault();await adapter.updateCase({id,...Object.fromEntries(new FormData(e.target).entries())});closeModal();render();toast('Case updated locally')}}
function adminCard(label,value,note){return `<div class="card"><div class="muted small">${label}</div><div class="stat">${value}</div><div class="small muted">${note}</div></div>`}
function renderAdmin(){const open=state.cases.filter(c=>c.status==='Open').length,review=state.cases.filter(c=>c.status==='In Review').length,pub=state.guides.filter(g=>g.status==='Published').length;document.getElementById('app').innerHTML=`<div class="hero"><div><div class="eyebrow" style="color:#b9d0ff">การจัดการงานเทคนิค</div><h2>เปลี่ยนทุกเคส<br>เป็นความรู้ที่ใช้ร่วมกัน</h2><p>ติดตามเคส วิเคราะห์สาเหตุ และเผยแพร่วิธีแก้ไขที่ตรวจสอบแล้วให้ช่างภาคสนาม</p></div><div class="heroIcon">▦</div></div><div class="grid">${adminCard('เคสเปิดอยู่',open,'รอทีมเทคนิคตรวจสอบ')}${adminCard('In Review',review,'อยู่ระหว่างวิเคราะห์')}${adminCard('คู่มือเผยแพร่แล้ว',pub,'คู่มือที่ผ่านการอนุมัติ')}</div><div class="section"><h2>พื้นที่ทำงานทีมเทคนิค</h2><div class="tabs">${[['cases','รายการเคส'],['knowledge','จัดการคู่มือ'],['insights','สถิติและรายงาน']].map(([id,label])=>`<button class="tab ${adminTab===id?'active':''}" data-admintab="${id}">${label}</button>`).join('')}</div></div><div id="adminBody"></div>`;document.querySelectorAll('[data-admintab]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.admintab;renderAdmin()});renderAdminBody()}
function renderAdminBody(){const el=document.getElementById('adminBody');if(adminTab==='cases'){let rows=state.cases.filter(c=>adminFilter==='All'||c.status===adminFilter);el.innerHTML=`<div class="card"><div class="row" style="margin-bottom:14px"><h3>รายการเคสที่ส่งให้ทีมเทคนิค</h3><select class="input" style="max-width:170px" id="caseFilter">${['All','Open','In Review','Resolved','Closed'].map(s=>`<option ${adminFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>Case</th><th>รุ่นสินค้า</th><th>ปัญหา</th><th>ศูนย์บริการ</th><th>ความเร่งด่วน</th><th>สถานะ</th><th>ดำเนินการ</th></tr></thead><tbody>${rows.map(c=>`<tr><td><strong>${esc(c.id)}</strong></td><td>${esc(c.model)}</td><td>${esc(c.symptom)}</td><td>${esc(c.center)}</td><td>${esc(c.priority)}</td><td><span class="tag ${c.status==='Resolved'?'green':c.status==='In Review'?'amber':''}">${esc(c.status)}</span></td><td><button class="link" data-editcase="${esc(c.id)}">จัดการ →</button></td></tr>`).join('')}</tbody></table></div></div>`;document.getElementById('caseFilter').onchange=e=>{adminFilter=e.target.value;renderAdminBody()};document.querySelectorAll('[data-editcase]').forEach(b=>b.onclick=()=>openCase(b.dataset.editcase,true))}else if(adminTab==='knowledge'){el.innerHTML=`<div class="row" style="margin-bottom:14px"><p class="muted">เฉพาะคู่มือที่อนุมัติและเผยแพร่แล้วเท่านั้นที่ช่างมองเห็น</p><button class="btn" id="newGuide">+ เพิ่มคู่มือใหม่</button></div><div class="card tablewrap"><table><thead><tr><th>รหัสคู่มือ</th><th>ชื่อคู่มือ</th><th>ประเภทสินค้า</th><th>รุ่นสินค้า</th><th>เวอร์ชัน</th><th>สถานะ</th><th>ดำเนินการ</th></tr></thead><tbody>${state.guides.map(g=>`<tr><td>${esc(g.id)}</td><td>${esc(g.title)}</td><td>${esc(g.product)}</td><td>${esc(g.model)}</td><td>${esc(g.version)}</td><td><span class="tag ${g.status==='Published'?'green':'amber'}">${esc(g.status)}</span></td><td><button class="link" data-editguide="${esc(g.id)}">${g.status==='Published'?'ดู / แก้ไข':'ตรวจสอบ / เผยแพร่'} →</button></td></tr>`).join('')}</tbody></table></div>`;document.getElementById('newGuide').onclick=()=>openGuideEditor();document.querySelectorAll('[data-editguide]').forEach(b=>b.onclick=()=>openGuideEditor(b.dataset.editguide))}else{const feedback=state.feedback.length,help=state.feedback.filter(x=>x.helpful).length;el.innerHTML=`<div class="grid">${adminCard('จำนวนเคส',state.cases.length,'เคสสาธิต')}${adminCard('ผลตอบรับคู่มือ',feedback,'จำนวนการให้คะแนน')}${adminCard('คะแนนความเป็นประโยชน์',feedback?Math.round(help/feedback*100)+'%':'—','คำนวณจากผลตอบรับ')}</div><div class="section"><h2>ประวัติการดำเนินการล่าสุด</h2></div><div class="card tablewrap"><table><thead><tr><th>เวลา</th><th>ดำเนินการ</th><th>รายการอ้างอิง</th></tr></thead><tbody>${state.audit.length?state.audit.slice(0,12).map(a=>`<tr><td>${esc(a.at)}</td><td>${esc(a.action)}</td><td>${esc(a.id)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">ยังไม่มีรายการใหม่</td></tr>'}</tbody></table></div>`}}
function openGuideEditor(id){const g=state.guides.find(x=>x.id===id);modal(`<h2>${g?'ตรวจสอบบทความคู่มือ':'สร้างบทความคู่มือ'}</h2><p class="muted">บทความจะยังเป็นฉบับร่างจนกว่าผู้มีสิทธิ์จะอนุมัติเผยแพร่</p><form id="guideForm" class="formgrid"><div class="field"><label>ประเภทสินค้า</label><select name="product" class="input">${['Washer','Air Conditioner','Refrigerator','Dryer','TV','Other'].map(p=>`<option ${g?.product===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label>รุ่นที่รองรับ</label><input class="input" name="model" required value="${esc(g?.model||'')}"></div><div class="field full"><label>ชื่อบทความ</label><input class="input" name="title" required value="${esc(g?.title||'')}"></div><div class="field full"><label>อาการเสีย</label><input class="input" name="symptom" required value="${esc(g?.symptom||'')}"></div><div class="field full"><label>คำค้นหา</label><input class="input" name="keywords" value="${esc(g?.keywords||'')}"></div><div class="field full"><label>สรุป</label><textarea class="input" name="summary" required>${esc(g?.summary||'')}</textarea></div><div class="field full"><label>ขั้นตอนตรวจสอบ (หนึ่งขั้นตอนต่อบรรทัด)</label><textarea class="input" name="steps" required>${esc(g?.steps.join('\n')||'')}</textarea></div><div class="field full row"><button class="btn" type="submit">บันทึกคู่มือ</button>${g?.status==='Draft'?`<button class="btn secondary" type="button" id="publishBtn">อนุมัติและเผยแพร่</button>`:''}</div></form>`);document.getElementById('guideForm').onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target).entries());p.steps=p.steps.split('\n').map(x=>x.trim()).filter(Boolean);if(g)p.id=g.id,p.status=g.status,p.version=g.version;await adapter.saveGuide(p);closeModal();render();toast('บันทึกบทความในเครื่องแล้ว')};if(g?.status==='Draft')document.getElementById('publishBtn').onclick=async()=>{if(!confirm('ยืนยันเผยแพร่คู่มือนี้ให้ช่างเห็นหรือไม่? ระบบจริงต้องตรวจสิทธิ์ผู้อนุมัติและแหล่งข้อมูลก่อน'))return;await adapter.approveGuide(g.id);closeModal();render();toast('เผยแพร่คู่มือในโหมดสาธิตแล้ว')}}
function renderArchitecture(){document.getElementById('app').innerHTML=`<div class="hero"><div><div class="eyebrow" style="color:#b9d0ff">ระบบต้นแบบ GOOGLE WORKSPACE</div><h2>ระบบต้นทุนต่ำ<br>พร้อมเชื่อม AI ภายใน</h2><p>เริ่มจากการค้นหาคู่มือที่ผ่านการตรวจสอบและระบบจัดการเคส ก่อนเชื่อม AI ภายในที่ IT อนุมัติ</p></div><div class="heroIcon">⚙</div></div><div class="two"><div class="card"><h3>องค์ประกอบระบบ</h3><div class="stack">${[['01','หน้าจอเว็บบนมือถือ','Apps Script HTML Service'],['02','API / ตรวจสอบสิทธิ์','Apps Script server-side functions'],['03','ดัชนีคู่มือและข้อมูลเคส','Google Sheets'],['04','ไฟล์คู่มือที่อนุมัติ','Google Drive / Shared Drive'],['05','AI ภายใน (ระยะถัดไป)','เชื่อมต่อเฉพาะระบบภายในที่ IT อนุมัติ']].map(([n,a,b])=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><span class="tag">${n}</span><div style="flex:1"><strong>${a}</strong><div class="small muted">${b}</div></div></div>`).join('')}</div></div><div class="card"><h3>ความพร้อมก่อนใช้งานจริง</h3><p class="notice small">ไฟล์นี้ทำงานในโหมดสาธิตบนเครื่อง ไม่ส่งข้อมูลไปยัง Google, Samsung, LINE หรือ AI</p><ol class="small" style="padding-left:20px;line-height:2"><li>ให้ IT อนุมัติระบบยืนยันตัวตนและสิทธิ์ศูนย์บริการคู่ค้า</li><li>สร้าง Google Sheets และโฟลเดอร์ Drive ที่กำหนดสิทธิ์แล้ว</li><li>พัฒนา API ฝั่ง Apps Script พร้อมตรวจสอบสิทธิ์</li><li>เปลี่ยนตัวเชื่อมข้อมูลจำลองเป็น google.script.run</li><li>เผยแพร่ Web App แบบจำกัดสิทธิ์และทดสอบกับกลุ่มนำร่อง</li><li>ทดสอบผู้ใช้พร้อมกัน โควตา ประวัติการใช้งาน และการสำรองข้อมูล</li></ol></div></div><div class="section"><h2>แท็บ Google Sheets ที่แนะนำ</h2></div><div class="grid">${[['Users','Email · Role · Service ศูนย์บริการ · Active'],['Knowledge','รหัสคู่มือ · ประเภทสินค้า · รุ่นสินค้า · เวอร์ชัน · สถานะ'],['Cases','เลขที่เคส · รุ่นสินค้า · อาการเสีย · Owner · สถานะ'],['Case_ดำเนินการs','เลขที่เคส · Root Cause · ดำเนินการ · Result'],['Approvals','รหัสคู่มือ · Approver · Decision · Date'],['Feedback / Audit','Guide Rating · Events · เวลาstamps']].map(([a,b])=>`<div class="card"><h3>${a}</h3><div class="small muted">${b}</div></div>`).join('')}</div><div class="section"><h2>ความปลอดภัยและการรองรับผู้ใช้จำนวนมาก</h2></div><div class="card"><p>ใช้บัญชีที่องค์กรอนุมัติและตรวจสิทธิ์ฝั่งเซิร์ฟเวอร์ ห้ามเปิดให้เข้าแบบไม่ระบุตัวตนหรือใช้บัญชี Google ส่วนตัว ต้องออกแบบสิทธิ์ของศูนย์บริการคู่ค้าร่วมกับ IT ก่อนใช้งานจริง</p><p>ทำแคชดัชนีค้นหา อ่านข้อมูลเป็นชุด ป้องกันการเขียนข้อมูลชนกัน และวัดเวลาตอบสนอง Apps Script เหมาะสำหรับนำร่อง แต่ต้องทดสอบประสิทธิภาพก่อนขยายทั่วประเทศ</p><p><strong>นโยบาย AI:</strong> ใช้ AI ภายในเท่านั้น ห้ามส่งคู่มือภายใน ข้อมูลลูกค้า หรือบันทึกเคสไปยัง AI สาธารณะ</p></div>`}
function render(){if(view==='technician')renderTechnician();else if(view==='admin')renderAdmin();else renderArchitecture()}render();
</script></body></html>
