8ad;display:grid;justify-items:center;gap:3px;font-size:10px}.bottom button span{font-size:22px;line-height:1.2}.bottom button.active{color:var(--blue);font-weight:800}.back{background:transparent;border:0;font-size:21px;color:#20447b;padding:4px 9px 4px 0}.detailtop{display:flex;align-items:center;gap:9px;margin-bottom:15px}.detailtop h2{font-size:18px;margin:0}.panel{background:white;border:1px solid #e4ecf9;border-radius:20px;padding:17px;margin:12px 0;box-shadow:var(--shadow)}.panel h3{margin:0 0 10px;font-size:15px}.panel p{margin:5px 0;font-size:13px}.panel ul,.panel ol{padding-left:22px;margin:7px 0;line-height:1.9}.panel li{margin:7px 0}.step{display:flex;gap:11px;align-items:flex-start;margin:12px 0}.step b{background:#1b65d8;color:#fff;width:25px;height:25px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:12px}.step p{margin:0;flex:1}.actions{display:flex;gap:9px;margin:18px 0}.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:750;background:#e9f1ff;color:#1557bd;text-align:center;text-decoration:none}.btn.primary{background:var(--blue);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.actions .btn{flex:1;font-size:12px}.formfield{margin:13px 0}.formfield label{display:block;font-weight:700;font-size:12px;margin-bottom:7px}.formfield input,.formfield textarea,.formfield select{width:100%;border:1px solid #dfe8f7;border-radius:12px;padding:12px;background:#fff;outline-color:#83b0ff;color:var(--ink)}.formfield textarea{min-height:100px;resize:vertical}.filters{display:flex;gap:7px;overflow:auto;padding:3px 0 14px}.filters button{white-space:nowrap;border:1px solid #e2eaf8;background:#fff;padding:9px 12px;border-radius:20px;color:#5a6d8a;font-size:12px}.notice{border:1px solid #f2dfb9;background:#fff9e9;border-radius:15px;padding:13px;color:#805b1e;font-size:12px;margin:14px 0}.empty{text-align:center;padding:30px 15px;color:var(--muted)}.muted{color:var(--muted)}.statrow{display:grid;grid-template-columns:repeat(3,1f {id:'G01',cat:'washer',icon:'🧺',model:'WD25D',code:'3CA',title:'WD25D — Error 3CA',desc:'เครื่องแสดงรหัส 3CA ระหว่างทำงาน',status:'review',cause:['ยังไม่ยืนยันความหมายรหัส 3CA จากคู่มือเทคนิคตรงรุ่น','ต้องตรวจสอบรุ่นเต็มและอาการที่เกิดร่วมกันก่อนสรุปสาเหตุ'],steps:['บันทึก Model Code เต็ม รหัส 3CA และช่วงเวลาที่เกิดอาการ','ตรวจสอบข้อความแจ้งเตือนตามคู่มือ Samsung ของรุ่นที่ตรงกัน','หากเครื่องทำงานผิดปกติ ให้หยุดใช้งานและส่งข้อมูลให้ทีมเทคนิค','การตรวจวงจร มอเตอร์ หรือระบบไฟฟ้าต้องอ้างอิง Service Manual ที่ได้รับอนุมัติ'],keywords:'WD25D 3CA error washer combo'},

const cats=[['all','ทั้งหมด'],['washer','เครื่องซักผ้า'],['ac','แอร์'],['fridge','ตู้เย็น'],['tv','ทีวี']];const key='ce-tech-hub-app-v7-demo';let page='home',selected=null,category='all',query='',caseFilter='all',draftGuide=null;let cases=[];try{cases=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(cases))cases=[]}catch{cases=[]}function persist(){try{localStorage.setItem(key,JSON.stringify(cases))}catch(e){notify('เบราว์เซอร์ไม่อนุญาตให้บันทึกข้อมูลถาวร')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hide');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.add('hide'),2700)}function nav(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p||(p==='detail'&&b.dataset.page==='knowledge')));render();window.scrollTo({top:0,behavior:'instant'})}function categoryLabel(c){return cats.find(x=>x[0]===c)?.[1]||c}function guideRow(g){return `<button class="item" data-guide="${g.id}"><span class="thumb">${g.icon}</span><span class="itemtext"><strong>${esc(g.title)}</strong><small>${esc(g.desc)}</small><span class="pill ${g.status==='review'?'warn':''}">${g.status==='review'?'รอตรวจสอบ':'ข้อมูลสาธารณะ'}</span></span><span class="arrow">›</span></button>`}function match(g){return (category==='all'||g.cat===category)&&(!query||[g.title,g.desc,g.code,g.model,g.keywords,categoryLabel(g.cat)].join(' ').toLowerCase().includes(query.toLowerCase()))}function listGuide(){const data=guides.filter(match);return data.length?data.map(guideRow).join(''):'<div class="panel empty">ไม่พบข้อมูล ลองค้นหารหัสอื่น หรือเปิดคู่มือ Samsung ตามรุ่น</div>'}function home(){return `<div class="hero"><span class="eyebrow">TECHNICAL SUPPORT</span><h1>ศูนย์ความรู้<br>สำหรับช่างบริการ</h1><p>ค้นหาคู่มือ อาการเสีย และส่งต่อปัญหาให้ทีมเทคนิคได้สะดวกขึ้น</p></div><div class="searchbox"><span style="font-size:20px">⌕</span><input id="homeSearch" placeholder="ค้นหา Model / Error Code เช่น WD25D 3CA" value="${esc(query)}"><button id="goSearch" aria-label="ค้นหา">⌕</button></div><div class="sectionhead"><h2>เมนูหลัก</h2></div><div class="tiles"><button class="tile" data-go="knowledge"><span class="emoji">📖</span><strong>คลังความรู้</strong><small>คู่มือ / วิธีตรวจสอบ</small></button><button class="tile" data-go="report"><span class="emoji">🛠️</span><strong>แจ้งเคสซ่อม</strong><small>ส่งคำถามถึงทีมเทคนิค</small></button><button class="tile" data-go="cases"><span class="emoji">📋</span><strong>ติดตามเคส</strong><small>ตรวจสอบสถานะ</small></button><button class="tile" data-go="news"><span class="emoji">📣</span><strong>ข่าวสาร</strong><small>อบรม / ประกาศ</small></button></div><div class="sectionhead"><h2>หมวดหมู่สินค้า</h2><button data-go="knowledge">ดูทั้งหมด ›</button></div><div class="cats">${cats.slice(1).map(([id,name])=>`<button data-cat="${id}">${id==='washer'?'🧺':id==='ac'?'❄️':id==='fridge'?'🧊':'📺'} ${name}</button>`).join('')}</div><div class="sectionhead"><h2>เรื่องที่พบบ่อย</h2><button data-go="knowledge">ดูทั้งหมด ›</button></div><div class="list">${[guides[0],guides[4],guides[6]].map(guideRow).join('')}</div><div class="notice">เวอร์ชันทดลอง • เนื้อหาไม่ใช่ Service Manual ที่ผ่านการอนุมัติ • ห้ามใส่ข้อมูลลูกค้าจริง</div>`}function knowledge(){return `<div class="detailtop"><h2>📖 คลังความรู้</h2></div><div class="searchbox" style="margin:0 0 17px"><span style="font-size:20px">⌕</span><input id="knowledgeSearch" placeholder="ค้นหา Model / Error Code / อาการ" value="${esc(query)}"><button id="clearSearch" aria-label="ล้างคำค้น">×</button></div><div class="cats">${cats.map(([id,name])=>`<button class="${category===id?'active':''}" data-cat="${id}">${name}</button>`).join('')}</div><div class="sectionhead"><h2>ผลการค้นหา</h2><span class="sub">${guides.filter(match).length} หัวข้อ</span></div><div class="list">${listGuide()}</div><div class="panel"><strong>ต้องการคู่มือรุ่นอื่น?</strong><p class="muted">ค้นหา User Manual และคู่มือการใช้งานจาก Samsung Thailand โดยตรง</p><a class="btn" style="display:block;margin-top:10px" href="${official}" target="_blank" rel="noopener noreferrer">เปิด Samsung Support ↗</a></div>`}function detail(){const g=guides.find(x=>x.id===selected);if(!g)return knowledge();return `<div class="detailtop"><button class="back" data-go="knowledge">‹</button><h2>รายละเอียดวิธีตรวจสอบ</h2></div><div class="panel" style="background:linear-gradient(120deg,#e9f2ff,#fff)"><div style="display:flex;justify-content:space-between;gap:12px"><span class="pill">${categoryLabel(g.cat)}</span><span class="pill ${g.status==='review'?'warn':''}">${g.status==='review'?'รอตรวจสอบ':'ข้อมูลสาธารณะ'}</span></div><h2 style="margin:13px 0 4px;font-size:21px">${esc(g.title)}</h2><p class="muted">รุ่น: ${esc(g.model)} · รหัส: ${esc(g.code)}</p></div><div class="panel"><h3>⚠️ อาการที่พบ</h3><p>${esc(g.desc)}</p></div><div class="panel"><h3>▤ สาเหตุที่เป็นไปได้ / จุดที่ควรตรวจสอบ</h3><ul>${g.cause.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div><div class="panel"><h3>🛠️ แนวทางตรวจสอบเบื้องต้น</h3>${g.steps.map((s,i)=>`<div class="step"><b>${i+1}</b><p>${esc(s)}</p></div>`).join('')}</div><div class="notice">${g.status==='review'?'รหัสนี้ยังไม่ได้ยืนยันความหมายจากเอกสาร Samsung ตรงรุ่น ห้ามใช้เพื่อระบุชิ้นส่วนเสียหรือสั่งเปลี่ยนอะไหล่':'แนวทางนี้เป็นข้อมูลตรวจสอบเบื้องต้น ต้องยืนยันตามคู่มือของรุ่นจริงก่อนดำเนินการ'}</div><div class="actions"><a class="btn" href="${official}" target="_blank" rel="noopener noreferrer">📖 คู่มือ Samsung ↗</a><button class="btn primary" id="createFromGuide">➤ ส่งเคสทีมเทคนิค</button></div>`}function report(){return `<div class="detailtop"><h2>🛠️ แจ้งเคสซ่อม</h2></div><div class="panel"><div class="pill">ขั้นตอน 1 จาก 2 · กรอกข้อมูล</div><h3 style="margin-top:14px">ข้อมูลปัญหาที่พบ</h3><form id="caseForm"><div class="formfield"><label>ประเภทสินค้า *</label><select name="product" required><option value="">เลือกประเภทสินค้า</option>${cats.slice(1).map(([id,name])=>`<option value="${id}" ${draftGuide?.cat===id?'selected':''}>${name}</option>`).join('')}</select></div><div class="formfield"><label>Model Code *</label><input name="model" placeholder="เช่น WD25D..." value="${esc(draftGuide?.model||'')}" required></div><div class="formfield"><label>Error Code (ถ้ามี)</label><input name="error" placeholder="เช่น 3CA / 4C" value="${esc(draftGuide?.code||'')}"></div><div class="formfield"><label>อาการที่พบ *</label><textarea name="symptom" placeholder="ระบุอาการ ช่วงเวลาที่พบ และสิ่งที่ตรวจสอบแล้ว" required>${esc(draftGuide?.desc||'')}</textarea></div><div class="formfield"><label>ศูนย์บริการ / ผู้แจ้ง (ชื่อสมมติสำหรับ Demo)</label><input name="center" placeholder="เช่น ศูนย์บริการนำร่อง"></div><button class="btn primary" style="width:100%" type="submit">บันทึกเคสทดลอง →</button></form></div><div class="notice">ข้อมูลนี้จะเก็บเฉพาะเบราว์เซอร์ของเครื่องที่ใช้งาน ไม่ได้ส่งให้ทีมเทคนิคจริง และไม่รองรับการแนบไฟล์</div>`}function caseCard(c){let badge=c.status==='ปิดเคส'?'green':c.status==='กำลังดำเนินการ'?'warn':'';return `<button class="item" data-case="${esc(c.id)}"><span class="thumb">${c.product==='ac'?'❄️':c.product==='fridge'?'🧊':c.product==='tv'?'📺':'🧺'}</span><span class="itemtext"><strong>${esc(c.id)}</strong><small>${esc(c.model)} · ${esc(c.error||c.symptom)}</small><span class="pill ${badge}">${esc(c.status)}</span></span><span class="arrow">›</span></button>`}function casesPage(){const filtered=cases.filter(c=>caseFilter==='all'||c.status===caseFilter);return `<div class="detailtop"><h2>📋 เคสของฉัน</h2></div><div class="statrow"><div class="stat"><strong>${cases.length}</strong><small>เคสทั้งหมด</small></div><div class="stat"><strong>${cases.filter(c=>c.status!=='ปิดเคส').length}</strong><small>กำลังติดตาม</small></div><div class="stat"><strong>${cases.filter(c=>c.status==='ปิดเคส').length}</strong><small>ปิดเคส</small></div></div><div class="sectionhead"><h2>รายการเคส</h2><button data-go="report">+ แจ้งเคส</button></div><div class="filters">${[['all','ทั้งหมด'],['รอทีมเทคนิค','รอตอบกลับ'],['กำลังดำเนินการ','กำลังดำเนินการ'],['ปิดเคส','ปิดเคส']].map(([v,n])=>`<button data-filter="${v}" class="${caseFilter===v?'active':''}">${n}</button>`).join('')}</div><div class="list">${filtered.length?filtered.map(caseCard).join(''):'<div class="panel empty">ยังไม่มีเคสในหมวดนี้<br>กด “แจ้งเคส” เพื่อทดลองสร้างเคสใหม่</div>'}</div><div class="notice">รายการเคสแสดงเฉพาะข้อมูลที่สร้างในเบราว์เซอร์นี้ ไม่เชื่อมกับศูนย์บริการหรือทีม Samsung</div>`}function caseDetail(){const c=cases.find(x=>x.id===selected);if(!c)return casesPage();return `<div class="detailtop"><button class="back" data-go="cases">‹</button><h2>รายละเอียดเคส</h2></div><div class="panel"><span class="pill">${esc(c.status)}</span><h2>${esc(c.id)}</h2><p><strong>รุ่น:</strong> ${esc(c.model)}</p><p><strong>รหัส:</strong> ${esc(c.error||'ไม่ระบุ')}</p><p><strong>อาการ:</strong> ${esc(c.symptom)}</p><p><strong>ศูนย์บริการ:</strong> ${esc(c.center||'ไม่ระบุ')}</p><p class="muted">สร้างเมื่อ ${esc(c.created)}</p></div><div class="panel"><h3>สถานะดำเนินการ (Demo)</h3><div class="progress"><span style="width:${c.status==='ปิดเคส'?100:c.status==='กำลังดำเนินการ'?65:25}%"></span></div><div class="actions"><button class="btn" data-status="กำลังดำเนินการ">กำลังดำเนินการ</button><button class="btn primary" data-status="ปิดเคส">ปิดเคส</button></div><button class="btn" style="width:100%" data-status="รอทีมเทคนิค">กลับไปรอตอบกลับ</button></div><div class="notice">การเปลี่ยนสถานะเป็นเพียงการจำลอง ไม่ใช่การตอบรับจาก Technical Support จริง</div>`}function profile(){return `<div class="detailtop"><h2>♙ โปรไฟล์และข้อมูลระบบ</h2></div><div class="panel" style="text-align:center;padding:25px"><div style="font-size:43px">👨‍🔧</div><h2 style="margin:5px">ช่างบริการ (บัญชีทดลอง)</h2><p class="muted">CE Tech Hub · Technician Support</p><span class="pill">Demo Mode</span></div><div class="panel"><h3>ข้อมูลการใช้งาน</h3><p>คู่มือสาธิต: ${guides.length} หัวข้อ</p><p>เคสในเครื่องนี้: ${cases.length} เคส</p><p>แหล่งคู่มือ: Samsung Support และแนวทางทั่วไปที่ต้องตรวจสอบ</p></div><div class="panel"><h3>ตั้งค่าทดลอง</h3><button class="btn" id="resetCases" style="width:100%">ล้างเคสทดลองในเครื่อง</button></div><div class="notice">เว็บไซต์นี้เป็น Prototype สาธารณะ ไม่มี Login จริง ไม่ใช่ระบบบริการที่ Samsung รับรอง และห้ามใช้ข้อมูลลูกค้าจริง</div>`}function news(){return `<div class="detailtop"><button class="back" data-go="home">‹</button><h2>📣 ข่าวสารและการอบรม</h2></div><div class="panel"><span class="pill">ตัวอย่างประกาศ</span><h3>ยกระดับทักษะช่างบริการ</h3><p>พื้นที่สำหรับแจ้งตารางอบรม เทคนิคใหม่ และข่าวสารทีม Technical Support เมื่อมีการเชื่อมระบบจริง</p></div><div class="panel"><span class="pill">แหล่งข้อมูล</span><h3>คู่มือและคำแนะนำ Samsung</h3><p>เปิดเว็บไซต์สนับสนุนทางการเพื่อค้นหาคู่มือตามรุ่นสินค้า</p><a href="${official}" target="_blank" rel="noopener noreferrer">เปิด Samsung Support ↗</a></div>`}function render(){const root=document.getElementById('screen');root.innerHTML=page==='home'?home():page==='knowledge'?knowledge():page==='detail'?detail():page==='report'?report():page==='cases'?casesPage():page==='caseDetail'?caseDetail():page==='profile'?profile():news();root.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.go==='report')draftGuide=null;nav(b.dataset.go)}));root.querySelectorAll('[data-guide]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.guide;nav('detail')}));root.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.cat;nav('knowledge')}));const hs=root.querySelector('#homeSearch');if(hs){hs.addEventListener('input',e=>query=e.target.value);hs.addEventListener('keydown',e=>{if(e.key==='Enter')nav('knowledge')});root.querySelector('#goSearch').onclick=()=>nav('knowledge')}const ks=root.querySelector('#knowledgeSearch');if(ks){ks.addEventListener('input',e=>{query=e.target.value;const start=e.target.selectionStart;render();const n=document.getElementById('knowledgeSearch');n.focus();n.setSelectionRange(start,start)});root.querySelector('#clearSearch').onclick=()=>{query='';render()}}const from=root.querySelector('#createFromGuide');if(from)from.onclick=()=>{draftGuide=guides.find(g=>g.id===selected);nav('report')};const form=root.querySelector('#caseForm');if(form)form.addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form).entries());if(!d.product||!d.model.trim()||!d.symptom.trim()){notify('กรุณากรอกข้อมูลที่จำเป็น');return}const c={...d,id:'CS-'+Date.now().toString().slice(-8),status:'รอทีมเทคนิค',created:new Date().toLocaleString('th-TH')};cases.unshift(c);persist();draftGuide=null;caseFilter='all';notify('บันทึกเคสทดลองสำเร็จ');nav('cases')});root.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{caseFilter=b.dataset.filter;render()});root.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{selected=b.dataset.case;nav('caseDetail')});root.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{const c=cases.find(x=>x.id===selected);if(c){c.status=b.dataset.status;persist();notify('เปลี่ยนสถานะทดลองแล้ว');render()}});const reset=root.querySelector('#resetCases');if(reset)reset.onclick=()=>{if(confirm('ลบเคสทดลองทั้งหมดในเบราว์เซอร์นี้?')){cases=[];persist();notify('ล้างเคสทดลองแล้ว');render()}}}document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{if(b.dataset.page==='report')draftGuide=null;nav(b.dataset.page)});document.getElementById('alerts').onclick=()=>nav('news');const initial=new URLSearchParams(location.search).get('page');if(['knowledge','report','cases','profile','news'].includes(initial))page=initial;render();
</script></body></html>
